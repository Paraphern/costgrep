name: 'CostGrep'
description: >-
  GitHub Actions cost breakdown by who triggered the run: human vs AI agent
  (Copilot, Claude, Codex, Cursor...) vs bot. List-price model, public
  methodology, per-job evidence trail, runs on your runner — no data leaves
  your infrastructure.
author: 'Paraphern'

inputs:
  days:
    description: 'Look-back window in days'
    default: '30'
  token:
    description: 'GitHub token with actions:read (repo-scoped GITHUB_TOKEN is enough)'
    default: '${{ github.token }}'
  max-runs:
    description: 'Safety cap on analyzed workflow runs'
    default: '500'
  config:
    description: 'Optional JSON file {agents, bots, rates} to extend/override defaults'
    default: ''
  json-file:
    description: 'Where to write the full JSON report (relative to workspace)'
    default: 'costgrep.json'
  csv-file:
    description: 'Optional: write per-job evidence CSV here (audit trail)'
    default: ''
  md-file:
    description: 'Optional: write shareable Markdown report with provenance here'
    default: ''

outputs:
  total-cost:
    description: 'Total list-price CI spend, USD'
  total-minutes:
    description: 'Total billable minutes (rounded per job, like GitHub)'
  agent-cost:
    description: 'List-price spend attributed to AI agents, USD'
  agent-share-pct:
    description: 'Agents share of total CI spend, % (e.g. "6.8")'
  agent-runs:
    description: 'Workflow runs attributed to AI agents'
  bot-runs:
    description: 'Workflow runs attributed to bots'
  bot-runs-pct:
    description: 'Bot share of all runs, %'

runs:
  using: 'composite'
  steps:
    - name: 'costgrep: human vs agent vs bot CI spend'
      shell: bash
      env:
        CG_TOKEN: ${{ inputs.token }}
        CG_REPO: ${{ github.repository }}
      run: |
        ARGS=(--repo "$CG_REPO" --days "${{ inputs.days }}" --max-runs "${{ inputs.max-runs }}" --token "$CG_TOKEN" --json-file "${{ inputs.json-file }}" --gh-output "$GITHUB_OUTPUT" --step-summary)
        if [ -n "${{ inputs.csv-file }}" ]; then ARGS+=(--csv-file "${{ inputs.csv-file }}"); fi
        if [ -n "${{ inputs.md-file }}" ]; then ARGS+=(--md-file "${{ inputs.md-file }}"); fi
        if [ -n "${{ inputs.config }}" ]; then ARGS+=(--config "${{ inputs.config }}"); fi
        node "${{ github.action_path }}/scripts/costgrep.mjs" "${ARGS[@]}"

branding:
  icon: 'bar-chart-2'
  color: 'purple'
