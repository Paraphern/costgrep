name: costgrep self-audit
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # required: local action (uses: ./) needs action.yml in the workspace
      - name: Report human vs agent vs bot CI spend for this repo
        uses: ./
        with:
          days: '30'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: costgrep-report
          path: costgrep.json
